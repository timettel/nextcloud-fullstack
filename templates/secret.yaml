{{- $name := include "nextcloud-stack.fullname" . -}}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $existing := dict -}}
{{- $managedKeys := list
  "harp-shared-key"
  "mariadb-root-password" "mariadb-password" "redis-password"
  "windmill-admin-password"
  "eurooffice-jwt-secret"
  "talk-signaling-secret" "talk-internal-secret" "turn-secret" "talk-recording-secret"
  "keycloak-database-password" "keycloak-client-secret"
  "lldap-jwt-secret" "lldap-key-seed" "ldap-bind-password"
  "mail-service-password" "nextcloud-mail-master-password"
  "roundcube-oauth-client-secret" "roundcube-database-password" "roundcube-des-key"
  "phpmyadmin-database-password" "phpmyadmin-oauth-client-secret" "phpmyadmin-oauth-cookie-secret"
  "whiteboard-jwt-secret" "s3-access-key" "s3-secret-key"
-}}
{{- if $existingSecret -}}
{{- range $key := $managedKeys -}}
{{- if hasKey $existingSecret.data $key -}}
{{- $_ := set $existing $key (index $existingSecret.data $key | b64dec) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- $optional := .Values.operator.optionalSecrets -}}
{{- $s3AccessKey := default (index $existing "s3-access-key") $optional.s3AccessKey -}}
{{- $s3SecretKey := default (index $existing "s3-secret-key") $optional.s3SecretKey -}}
{{- if ne (empty $s3AccessKey) (empty $s3SecretKey) -}}
{{- fail "operator.optionalSecrets.s3AccessKey and s3SecretKey must either both be set or both be empty" -}}
{{- end -}}
{{- if .Values.nextcloud.objectStore.enabled -}}
{{- $_ := required "operator.optionalSecrets.s3AccessKey is required when primary object storage is enabled" $s3AccessKey -}}
{{- $_ := required "operator.optionalSecrets.s3SecretKey is required when primary object storage is enabled" $s3SecretKey -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  nextcloud-admin-password: {{ required "operator.admins.nextcloud.password is required" .Values.operator.admins.nextcloud.password | quote }}
  mariadb-root-password: {{ default (default (randAlphaNum 48) (index $existing "mariadb-root-password")) $optional.mariadbRootPassword | quote }}
  mariadb-password: {{ default (default (randAlphaNum 48) (index $existing "mariadb-password")) $optional.mariadbPassword | quote }}
  redis-password: {{ default (default (randAlphaNum 48) (index $existing "redis-password")) $optional.redisPassword | quote }}
  eurooffice-jwt-secret: {{ default (default (randAlphaNum 64) (index $existing "eurooffice-jwt-secret")) $optional.euroofficeJwtSecret | quote }}

  {{- if .Values.appApi.enabled }}
  harp-shared-key: {{ default (randAlphaNum 64) (index $existing "harp-shared-key") | quote }}
  {{- end }}
  {{- if .Values.workflowengine.enabled }}
  windmill-admin-password: {{ default (default (randAlphaNum 48) (index $existing "windmill-admin-password")) $optional.windmillAdminPassword | quote }}
  {{- end }}
  {{- if .Values.identityDirectory.enabled }}
  lldap-admin-password: {{ required "operator.admins.ldap.password is required" .Values.operator.admins.ldap.password | quote }}
  lldap-jwt-secret: {{ default (default (randAlphaNum 64) (index $existing "lldap-jwt-secret")) $optional.lldapJwtSecret | quote }}
  lldap-key-seed: {{ default (default (randAlphaNum 32) (index $existing "lldap-key-seed")) $optional.lldapKeySeed | quote }}
  ldap-bind-password: {{ default (default (randAlphaNum 32) (index $existing "ldap-bind-password")) $optional.ldapBindPassword | quote }}
  {{- end }}
  {{- if .Values.mail.enabled }}
  mail-service-password: {{ default (default (randAlphaNum 32) (index $existing "mail-service-password")) $optional.mailServicePassword | quote }}
  nextcloud-mail-master-password: {{ default (default (randAlphaNum 48) (index $existing "nextcloud-mail-master-password")) $optional.nextcloudMailMasterPassword | quote }}
  {{- end }}
  {{- if .Values.talk.enabled }}
  talk-signaling-secret: {{ default (default (randAlphaNum 64) (index $existing "talk-signaling-secret")) $optional.talkSignalingSecret | quote }}
  talk-internal-secret: {{ default (default (randAlphaNum 64) (index $existing "talk-internal-secret")) $optional.talkInternalSecret | quote }}
  turn-secret: {{ default (default (randAlphaNum 64) (index $existing "turn-secret")) $optional.turnSecret | quote }}
  {{- if .Values.talk.recording.enabled }}
  talk-recording-secret: {{ default (default (randAlphaNum 64) (index $existing "talk-recording-secret")) $optional.talkRecordingSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.keycloak.enabled }}
  keycloak-admin-password: {{ required "operator.admins.keycloak.password is required" .Values.operator.admins.keycloak.password | quote }}
  keycloak-database-password: {{ default (default (randAlphaNum 48) (index $existing "keycloak-database-password")) $optional.keycloakDatabasePassword | quote }}
  keycloak-client-secret: {{ default (default (randAlphaNum 64) (index $existing "keycloak-client-secret")) $optional.keycloakClientSecret | quote }}
  {{- end }}
  {{- if .Values.roundcube.enabled }}
  roundcube-oauth-client-secret: {{ default (default (randAlphaNum 64) (index $existing "roundcube-oauth-client-secret")) $optional.roundcubeOauthClientSecret | quote }}
  roundcube-database-password: {{ default (default (randAlphaNum 48) (index $existing "roundcube-database-password")) $optional.roundcubeDatabasePassword | quote }}
  roundcube-des-key: {{ default (default (randAlphaNum 24) (index $existing "roundcube-des-key")) $optional.roundcubeDesKey | quote }}
  {{- end }}
  {{- if .Values.phpmyadmin.enabled }}
  phpmyadmin-database-password: {{ default (default (randAlphaNum 48) (index $existing "phpmyadmin-database-password")) $optional.phpmyadminDatabasePassword | quote }}
  {{- if eq .Values.phpmyadmin.auth.mode "keycloak" }}
  phpmyadmin-oauth-client-secret: {{ default (default (randAlphaNum 64) (index $existing "phpmyadmin-oauth-client-secret")) $optional.phpmyadminOauthClientSecret | quote }}
  phpmyadmin-oauth-cookie-secret: {{ default (default (randAlphaNum 32) (index $existing "phpmyadmin-oauth-cookie-secret")) $optional.phpmyadminOauthCookieSecret | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.whiteboard.enabled }}
  whiteboard-jwt-secret: {{ default (default (randAlphaNum 64) (index $existing "whiteboard-jwt-secret")) $optional.whiteboardJwtSecret | quote }}
  {{- end }}
  {{- if or .Values.nextcloud.objectStore.enabled (not (empty $s3AccessKey)) }}
  s3-access-key: {{ $s3AccessKey | quote }}
  s3-secret-key: {{ $s3SecretKey | quote }}
  {{- end }}
