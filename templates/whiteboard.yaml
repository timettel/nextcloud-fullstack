{{- if .Values.whiteboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-whiteboard
  labels:
    app.kubernetes.io/component: whiteboard
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: whiteboard
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.whiteboard.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-whiteboard
  labels:
    app.kubernetes.io/component: whiteboard
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: whiteboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: whiteboard
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: whiteboard
          image: "{{ .Values.whiteboard.image.repository }}:{{ .Values.whiteboard.image.tag }}"
          imagePullPolicy: {{ .Values.whiteboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.whiteboard.port }}
          env:
            - name: NEXTCLOUD_URL
              value: "https://{{ (include "nextcloud-stack.host" (list . "nextcloud")) }}"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: whiteboard-jwt-secret
            - name: HOST
              value: 0.0.0.0
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.whiteboard.resources | nindent 12 }}
{{- end }}
