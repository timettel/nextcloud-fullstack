apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-objectstore-hooks
  labels:
    app.kubernetes.io/component: nextcloud
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
data:
  objectstore.sh: |
    #!/bin/sh
    set -eu

    target=/var/www/html/config/zz-nextcloud-stack-objectstore.config.php
    installed=false
    if [ -f /var/www/html/config/config.php ] \
      && grep -Eq "['\"]installed['\"][[:space:]]*=>[[:space:]]*true" /var/www/html/config/config.php; then
      installed=true
    fi

    if [ "$NEXTCLOUD_OBJECTSTORE_ENABLED" != true ]; then
      if [ -f "$target" ]; then
        echo "Refusing to disable primary S3 storage on an installed Nextcloud instance." >&2
        echo "Primary storage cannot be changed in place; perform a fresh deployment instead." >&2
        exit 1
      fi
      exit 0
    fi

    if [ "$installed" = true ] && [ ! -f "$target" ]; then
      echo "Refusing to enable primary S3 storage on an existing filesystem-based instance." >&2
      echo "Primary storage must be selected before Nextcloud is installed." >&2
      exit 1
    fi

    mkdir -p "$(dirname "$target")"
    export NEXTCLOUD_OBJECTSTORE_CONFIG_TARGET="$target"
    php -r '
      $arguments = [
          "hostname" => getenv("S3_HOSTNAME"),
          "port" => (int) getenv("S3_PORT"),
          "bucket" => getenv("S3_BUCKET"),
          "region" => getenv("S3_REGION"),
          "key" => getenv("S3_ACCESS_KEY"),
          "secret" => getenv("S3_SECRET_KEY"),
          "use_ssl" => filter_var(getenv("S3_USE_SSL"), FILTER_VALIDATE_BOOLEAN),
          "use_path_style" => filter_var(getenv("S3_USE_PATH_STYLE"), FILTER_VALIDATE_BOOLEAN),
          "objectPrefix" => getenv("S3_OBJECT_PREFIX"),
      ];
      $target = getenv("NEXTCLOUD_OBJECTSTORE_CONFIG_TARGET");
      $temporary = $target . ".tmp";
      $contents = "<?php\n\$CONFIG = " . var_export([
          "objectstore" => [
              "class" => "\\OC\\Files\\ObjectStore\\S3",
              "arguments" => $arguments,
          ],
      ], true) . ";\n";
      if (file_put_contents($temporary, $contents, LOCK_EX) === false || !rename($temporary, $target)) {
          fwrite(STDERR, "Unable to write managed S3 primary-storage configuration\n");
          exit(1);
      }
    '
