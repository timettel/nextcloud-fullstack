# Single-node/integration profile. Workloads prefer separate nodes but may be
# co-located; Nextcloud uses RWO storage.
deploymentProfile: test

nextcloud:
  persistence:
    accessMode: ReadWriteOnce
  scheduling:
    antiAffinity: preferred

redis:
  scheduling:
    antiAffinity: preferred

mariadb:
  scheduling: {}

fulltextsearch:
  elasticsearch:
    scheduling:
      antiAffinity: preferred

# k3s embeds these control-plane components and does not expose the standard
# scrape endpoints expected by kube-prometheus-stack.
monitoring:
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false

# k3s keeps its containerd socket below /run/k3s.
checkmk:
  containerdOverride: /run/k3s/containerd/containerd.sock
