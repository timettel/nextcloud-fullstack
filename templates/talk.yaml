{{- if .Values.talk.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-talk
  labels:
    app.kubernetes.io/component: talk-hpb
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: talk-hpb
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: signaling
      port: 8081
      targetPort: signaling
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-talk
  labels:
    app.kubernetes.io/component: talk-hpb
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: talk-hpb
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: talk-hpb
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: talk
          image: "{{ .Values.talk.image.repository }}:{{ .Values.talk.image.tag }}"
          imagePullPolicy: {{ .Values.talk.image.pullPolicy }}
          env:
            - name: NC_DOMAIN
              value: {{ (include "nextcloud-stack.host" (list . "nextcloud")) | quote }}
            - name: TALK_HOST
              value: {{ (include "nextcloud-stack.host" (list . "turn")) | quote }}
            - name: TURN_DOMAIN
              value: {{ (include "nextcloud-stack.host" (list . "turn")) | quote }}
            - name: TALK_PORT
              value: {{ .Values.talk.turnPort | quote }}
            - name: TALK_MAX_STREAM_BITRATE
              value: {{ .Values.talk.maxStreamBitrate | quote }}
            - name: TALK_MAX_SCREEN_BITRATE
              value: {{ .Values.talk.maxScreenBitrate | quote }}
            - name: AIO_LOG_LEVEL
              value: {{ .Values.talk.logLevel | quote }}
            - name: TZ
              value: Europe/Berlin
            - name: SIGNALING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: talk-signaling-secret
            - name: INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: talk-internal-secret
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: turn-secret
          ports:
            - name: signaling
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            exec:
              command: [/healthcheck.sh]
            failureThreshold: 6
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: [/healthcheck.sh]
            initialDelaySeconds: 30
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [NET_RAW]
          volumeMounts:
            - name: run
              mountPath: /run
            - name: eturnal-run
              mountPath: /opt/eturnal/run
            - name: conf
              mountPath: /conf
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.talk.resources.hpb | nindent 12 }}
      volumes:
        - name: run
          emptyDir:
            medium: Memory
        - name: eturnal-run
          emptyDir:
            medium: Memory
        - name: conf
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-turn-udp
  labels:
    app.kubernetes.io/component: turn
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/component: turn
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: turn-udp
      port: {{ .Values.talk.turnPort }}
      targetPort: turn-udp
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-turn-tls
  labels:
    app.kubernetes.io/component: turn
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: turn
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: turns
      port: 5349
      targetPort: turns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-turn
  labels:
    app.kubernetes.io/component: turn
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: turn
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: turn
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: coturn
          image: "{{ .Values.talk.coturn.image.repository }}:{{ .Values.talk.coturn.image.tag }}"
          imagePullPolicy: {{ .Values.talk.coturn.image.pullPolicy }}
          command: [/bin/sh, -c]
          args:
            - |
              exec turnserver \
                -n \
                --log-file=stdout \
                --simple-log \
                --pidfile=/tmp/turnserver.pid \
                --fingerprint \
                --use-auth-secret \
                --static-auth-secret="$TURN_SECRET" \
                --realm="{{ (include "nextcloud-stack.host" (list . "turn")) }}" \
                --server-name="{{ (include "nextcloud-stack.host" (list . "turn")) }}" \
                --listening-ip="$HOST_IP" \
                --listening-ip="{{ .Values.operator.publicIp }}" \
                --relay-ip="{{ .Values.operator.publicIp }}" \
                --external-ip="{{ .Values.operator.publicIp }}" \
                --listening-port={{ .Values.talk.internalTurnPort }} \
                --tls-listening-port=5349 \
                --no-tcp \
                --min-port={{ .Values.talk.relayPortMin }} \
                --max-port={{ .Values.talk.relayPortMax }} \
                --cert=/certs/tls.crt \
                --pkey=/certs/tls.key \
                --no-multicast-peers \
                --stale-nonce=600
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: TURN_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: turn-secret
          ports:
            - name: turn-udp
              containerPort: {{ .Values.talk.internalTurnPort }}
              protocol: UDP
            - name: turns
              containerPort: 5349
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: turns
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: turns
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add: [NET_BIND_SERVICE]
              drop: [ALL]
          volumeMounts:
            - name: certificate
              mountPath: /certs
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.talk.resources.coturn | nindent 12 }}
      volumes:
        - name: certificate
          secret:
            secretName: {{ include "nextcloud-stack.fullname" . }}-tls
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
{{- end }}
