{{- if .Values.fulltextsearch.enabled }}
{{- $antiAffinity := required "fulltextsearch.elasticsearch.scheduling.antiAffinity must be set by values-test.yaml or values-prod.yaml" .Values.fulltextsearch.elasticsearch.scheduling.antiAffinity }}
{{- $elasticsearchReplicas := int .Values.fulltextsearch.elasticsearch.replicas }}
{{- if not (has $antiAffinity (list "preferred" "required")) }}
{{- fail "fulltextsearch.elasticsearch.scheduling.antiAffinity must be preferred or required" }}
{{- end }}
{{- if and (ne $elasticsearchReplicas 1) (lt $elasticsearchReplicas 3) }}
{{- fail "fulltextsearch.elasticsearch.replicas must be 1 (standalone) or at least 3 (clustered)" }}
{{- end }}
{{- if or (lt (int .Values.fulltextsearch.elasticsearch.indexReplicas) -1) (ge (int .Values.fulltextsearch.elasticsearch.indexReplicas) $elasticsearchReplicas) }}
{{- fail "fulltextsearch.elasticsearch.indexReplicas must be -1 (automatic) or between 0 and replicas - 1" }}
{{- end }}
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-elasticsearch
  labels:
    app.kubernetes.io/component: elasticsearch
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  version: {{ .Values.fulltextsearch.elasticsearch.version | quote }}
  http:
    tls:
      selfSignedCertificate:
        disabled: true
  nodeSets:
    - name: default
      count: {{ $elasticsearchReplicas }}
      {{- if and (gt $elasticsearchReplicas 1) .Values.fulltextsearch.elasticsearch.scheduling.zoneSpread.enabled (eq .Values.fulltextsearch.elasticsearch.scheduling.zoneSpread.whenUnsatisfiable "DoNotSchedule") }}
      zoneAwareness:
        topologyKey: {{ .Values.fulltextsearch.elasticsearch.scheduling.zoneSpread.topologyKey | quote }}
      {{- end }}
      config:
        node.roles: [master, data, ingest]
        indices.fielddata.cache.size: 20%
        indices.memory.index_buffer_size: 20%
        thread_pool.write.queue_size: 1000
      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/component: elasticsearch
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          {{- if and (gt $elasticsearchReplicas 1) .Values.fulltextsearch.elasticsearch.scheduling.zoneSpread.enabled }}
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: {{ .Values.fulltextsearch.elasticsearch.scheduling.zoneSpread.topologyKey | quote }}
              whenUnsatisfiable: {{ .Values.fulltextsearch.elasticsearch.scheduling.zoneSpread.whenUnsatisfiable }}
              labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/cluster-name: {{ include "nextcloud-stack.fullname" . }}-elasticsearch
          {{- end }}
          affinity:
            podAntiAffinity:
              {{- if eq $antiAffinity "required" }}
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      elasticsearch.k8s.elastic.co/cluster-name: {{ include "nextcloud-stack.fullname" . }}-elasticsearch
                  topologyKey: {{ .Values.fulltextsearch.elasticsearch.scheduling.topologyKey | quote }}
              {{- else }}
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        elasticsearch.k8s.elastic.co/cluster-name: {{ include "nextcloud-stack.fullname" . }}-elasticsearch
                    topologyKey: {{ .Values.fulltextsearch.elasticsearch.scheduling.topologyKey | quote }}
              {{- end }}
          {{- if hasPrefix "8." .Values.fulltextsearch.elasticsearch.version }}
          initContainers:
            - name: install-plugins
              command:
                - sh
                - -c
                - |
                  bin/elasticsearch-plugin list | grep -qx ingest-attachment || \
                    bin/elasticsearch-plugin install --batch ingest-attachment
              resources:
                {{- toYaml .Values.helperResources | nindent 16 }}
          {{- end }}
          containers:
            - name: elasticsearch
              resources:
                {{- toYaml .Values.fulltextsearch.elasticsearch.resources | nindent 16 }}
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            {{- with .Values.fulltextsearch.elasticsearch.storageClass }}
            storageClassName: {{ . | quote }}
            {{- end }}
            resources:
              requests:
                storage: {{ .Values.fulltextsearch.elasticsearch.storage }}
{{- end }}
