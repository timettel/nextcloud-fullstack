apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-mariadb-bootstrap
  labels:
    app.kubernetes.io/component: mariadb-bootstrap
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mariadb-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: mariadb-bootstrap
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          command: [/bin/sh, -c]
          args:
            - |
              set -eu
              ready=false
              for attempt in $(seq 1 120); do
                if mariadb-admin ping -h "$MARIADB_HOST" -uroot -p"$MARIADB_ROOT_PASSWORD" --silent; then
                  ready=true
                  break
                fi
                sleep 5
              done
              if [ "$ready" != true ]; then
                echo "MariaDB did not become ready within 10 minutes" >&2
                exit 1
              fi

              mariadb -h "$MARIADB_HOST" -uroot -p"$MARIADB_ROOT_PASSWORD" \
                -e "ALTER DATABASE \`$MARIADB_DATABASE\` CHARACTER SET $MARIADB_CHARACTER_SET COLLATE $MARIADB_COLLATION;"
              echo "MariaDB database defaults configured"
          env:
            - name: MARIADB_HOST
              value: {{ printf "%s-mariadb" (include "nextcloud-stack.fullname" .) | quote }}
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_CHARACTER_SET
              value: {{ .Values.mariadb.characterSet | quote }}
            - name: MARIADB_COLLATION
              value: {{ .Values.mariadb.collation | quote }}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: mariadb-root-password
          resources:
            {{- toYaml .Values.mariadb.bootstrap.resources | nindent 12 }}
