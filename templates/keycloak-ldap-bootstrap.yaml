{{- if .Values.keycloak.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-keycloak-ldap-bootstrap
  labels:
    app.kubernetes.io/component: keycloak-ldap-bootstrap
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/component: keycloak-ldap-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: configure
          image: "{{ .Values.keycloak.image.repository }}:{{ .Values.keycloak.image.tag }}"
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy }}
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail
              KCADM=/opt/keycloak/bin/kcadm.sh

              echo "Waiting for Keycloak..."
              until "$KCADM" config credentials \
                --server "$KEYCLOAK_URL" --realm master \
                --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD" >/dev/null 2>&1; do
                sleep 5
              done

              realm_id=$("$KCADM" get "realms/$KEYCLOAK_REALM" --fields id \
                | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
              test -n "$realm_id"

              echo "Applying the shared browser-session policy..."
              "$KCADM" update "realms/$KEYCLOAK_REALM" \
                -s accessTokenLifespan="$ACCESS_TOKEN_LIFESPAN" \
                -s ssoSessionIdleTimeout="$SESSION_IDLE_TIMEOUT" \
                -s ssoSessionMaxLifespan="$SESSION_MAX_LIFESPAN" \
                -s ssoSessionIdleTimeoutRememberMe="$SESSION_IDLE_TIMEOUT" \
                -s ssoSessionMaxLifespanRememberMe="$SESSION_MAX_LIFESPAN" \
                -s clientSessionIdleTimeout=0 \
                -s clientSessionMaxLifespan=0

              provider_id=$("$KCADM" get components -r "$KEYCLOAK_REALM" \
                -q name=lldap --fields id,name \
                | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)

              if [ -z "$provider_id" ]; then
                echo "Creating the LDAP user federation provider..."
                "$KCADM" create components -r "$KEYCLOAK_REALM" \
                  -s name=lldap \
                  -s providerId=ldap \
                  -s providerType=org.keycloak.storage.UserStorageProvider \
                  -s parentId="$realm_id" \
                  -s "config.vendor=[\"$LDAP_VENDOR\"]" \
                  -s 'config.editMode=["READ_ONLY"]' \
                  -s 'config.enabled=["true"]' \
                  -s 'config.priority=["0"]' \
                  -s 'config.importEnabled=["true"]' \
                  -s 'config.syncRegistrations=["false"]' \
                  -s "config.usernameLDAPAttribute=[\"$LDAP_USERNAME_ATTR\"]" \
                  -s "config.rdnLDAPAttribute=[\"$LDAP_RDN_ATTR\"]" \
                  -s "config.uuidLDAPAttribute=[\"$LDAP_UUID_ATTR\"]" \
                  -s "config.userObjectClasses=[\"$LDAP_USER_OBJECT_CLASS\"]" \
                  -s 'config.searchScope=["1"]' \
                  -s "config.pagination=[\"$LDAP_PAGINATION\"]" \
                  -s 'config.connectionPooling=["true"]' \
                  -s 'config.authType=["simple"]' \
                  -s "config.connectionUrl=[\"$LDAP_URL\"]" \
                  -s "config.usersDn=[\"$LDAP_USERS_DN\"]" \
                  -s "config.bindDn=[\"$LDAP_BIND_DN\"]" \
                  -s "config.bindCredential=[\"$LDAP_BIND_PASSWORD\"]" \
                  -s "config.customUserSearchFilter=[\"$LDAP_USER_FILTER\"]" \
                  -s 'config.useTruststoreSpi=["always"]' \
                  -s 'config.batchSizeForSync=["1000"]' \
                  -s 'config.fullSyncPeriod=["3600"]' \
                  -s 'config.changedSyncPeriod=["300"]' \
                  -s 'config.trustEmail=["true"]'

                provider_id=$("$KCADM" get components -r "$KEYCLOAK_REALM" \
                  -q name=lldap --fields id,name \
                  | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
              fi
              test -n "$provider_id"

              # Reconcile the complete provider so changing directory modes or
              # schema presets does not leave stale federation settings.
              "$KCADM" update "components/$provider_id" -r "$KEYCLOAK_REALM" \
                -s "config.vendor=[\"$LDAP_VENDOR\"]" \
                -s 'config.editMode=["READ_ONLY"]' \
                -s 'config.enabled=["true"]' \
                -s 'config.importEnabled=["true"]' \
                -s "config.connectionUrl=[\"$LDAP_URL\"]" \
                -s "config.usersDn=[\"$LDAP_USERS_DN\"]" \
                -s "config.bindDn=[\"$LDAP_BIND_DN\"]" \
                -s "config.bindCredential=[\"$LDAP_BIND_PASSWORD\"]" \
                -s "config.usernameLDAPAttribute=[\"$LDAP_USERNAME_ATTR\"]" \
                -s "config.rdnLDAPAttribute=[\"$LDAP_RDN_ATTR\"]" \
                -s "config.uuidLDAPAttribute=[\"$LDAP_UUID_ATTR\"]" \
                -s "config.userObjectClasses=[\"$LDAP_USER_OBJECT_CLASS\"]" \
                -s "config.customUserSearchFilter=[\"$LDAP_USER_FILTER\"]" \
                -s "config.pagination=[\"$LDAP_PAGINATION\"]" \
                -s 'config.useTruststoreSpi=["always"]' \
                -s "config.fullSyncPeriod=[\"$LDAP_FULL_SYNC_PERIOD\"]" \
                -s "config.changedSyncPeriod=[\"$LDAP_CHANGED_SYNC_PERIOD\"]" >/dev/null

              # Reconcile explicit name mappings for all supported schemas.
              first_name_mapper_id=$("$KCADM" get components -r "$KEYCLOAK_REALM" \
                -q parent="$provider_id" -q name="first name" --fields id,name \
                | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
              last_name_mapper_id=$("$KCADM" get components -r "$KEYCLOAK_REALM" \
                -q parent="$provider_id" -q name="last name" --fields id,name \
                | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
              test -n "$first_name_mapper_id"
              test -n "$last_name_mapper_id"

              "$KCADM" update "components/$first_name_mapper_id" -r "$KEYCLOAK_REALM" \
                -s "config.\"ldap.attribute\"=[\"$LDAP_FIRST_NAME_ATTR\"]" \
                -s 'config."user.model.attribute"=["firstName"]' >/dev/null
              "$KCADM" update "components/$last_name_mapper_id" -r "$KEYCLOAK_REALM" \
                -s "config.\"ldap.attribute\"=[\"$LDAP_LAST_NAME_ATTR\"]" \
                -s 'config."user.model.attribute"=["lastName"]' >/dev/null

              mapper_id=$("$KCADM" get components -r "$KEYCLOAK_REALM" \
                -q parent="$provider_id" -q name=groups --fields id,name \
                | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
              if [ -z "$mapper_id" ]; then
                echo "Creating the LDAP group mapper..."
                "$KCADM" create components -r "$KEYCLOAK_REALM" \
                  -s name=groups \
                  -s providerId=group-ldap-mapper \
                  -s providerType=org.keycloak.storage.ldap.mappers.LDAPStorageMapper \
                  -s parentId="$provider_id" \
                  -s "config.\"groups.dn\"=[\"$LDAP_GROUPS_DN\"]" \
                  -s "config.\"groups.ldap.filter\"=[\"$LDAP_GROUP_FILTER\"]" \
                  -s "config.\"group.name.ldap.attribute\"=[\"$LDAP_GROUP_NAME_ATTR\"]" \
                  -s "config.\"group.object.classes\"=[\"$LDAP_GROUP_OBJECT_CLASS\"]" \
                  -s "config.\"membership.ldap.attribute\"=[\"$LDAP_GROUP_MEMBERSHIP_ATTR\"]" \
                  -s "config.\"membership.attribute.type\"=[\"$LDAP_GROUP_MEMBERSHIP_TYPE\"]" \
                  -s "config.\"membership.user.ldap.attribute\"=[\"$LDAP_GROUP_MEMBERSHIP_USER_ATTR\"]" \
                  -s 'config.mode=["READ_ONLY"]' \
                  -s 'config."user.roles.retrieve.strategy"=["LOAD_GROUPS_BY_MEMBER_ATTRIBUTE"]' \
                  -s 'config."preserve.group.inheritance"=["true"]' \
                  -s 'config."drop.non.existing.groups.during.sync"=["false"]'
                mapper_id=$("$KCADM" get components -r "$KEYCLOAK_REALM" \
                  -q parent="$provider_id" -q name=groups --fields id,name \
                  | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
              fi
              test -n "$mapper_id"
              "$KCADM" update "components/$mapper_id" -r "$KEYCLOAK_REALM" \
                -s "config.\"groups.dn\"=[\"$LDAP_GROUPS_DN\"]" \
                -s "config.\"groups.ldap.filter\"=[\"$LDAP_GROUP_FILTER\"]" \
                -s "config.\"group.name.ldap.attribute\"=[\"$LDAP_GROUP_NAME_ATTR\"]" \
                -s "config.\"group.object.classes\"=[\"$LDAP_GROUP_OBJECT_CLASS\"]" \
                -s "config.\"membership.ldap.attribute\"=[\"$LDAP_GROUP_MEMBERSHIP_ATTR\"]" \
                -s "config.\"membership.attribute.type\"=[\"$LDAP_GROUP_MEMBERSHIP_TYPE\"]" \
                -s "config.\"membership.user.ldap.attribute\"=[\"$LDAP_GROUP_MEMBERSHIP_USER_ATTR\"]" \
                -s 'config.mode=["READ_ONLY"]' \
                -s 'config."user.roles.retrieve.strategy"=["LOAD_GROUPS_BY_MEMBER_ATTRIBUTE"]' >/dev/null

              echo "Synchronizing LDAP users and groups into Keycloak..."
              "$KCADM" create "user-storage/$provider_id/sync?action=triggerFullSync" \
                -r "$KEYCLOAK_REALM" >/dev/null
              echo "Keycloak LDAP federation configured"

              if [ "$ROUNDCUBE_ENABLED" = true ]; then
                echo "Ensuring the Roundcube OpenID Connect client exists..."
                roundcube_id=$("$KCADM" get clients -r "$KEYCLOAK_REALM" \
                  -q clientId="$ROUNDCUBE_CLIENT_ID" --fields id,clientId \
                  | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)

                if [ -z "$roundcube_id" ]; then
                  "$KCADM" create clients -r "$KEYCLOAK_REALM" \
                    -s clientId="$ROUNDCUBE_CLIENT_ID" \
                    -s name="Roundcube Webmail" \
                    -s enabled=true \
                    -s protocol=openid-connect \
                    -s publicClient=false \
                    -s secret="$ROUNDCUBE_CLIENT_SECRET" \
                    -s standardFlowEnabled=true \
                    -s directAccessGrantsEnabled=false \
                    -s serviceAccountsEnabled=false \
                    -s rootUrl="$ROUNDCUBE_URL" \
                    -s baseUrl="$ROUNDCUBE_URL" \
                    -s "redirectUris=[\"$ROUNDCUBE_URL/index.php/login/oauth\"]" \
                    -s "webOrigins=[\"$ROUNDCUBE_URL\"]" \
                    -s "attributes={\"post.logout.redirect.uris\":\"$ROUNDCUBE_URL/*\"}" >/dev/null
                else
                  "$KCADM" update "clients/$roundcube_id" -r "$KEYCLOAK_REALM" \
                    -s name="Roundcube Webmail" \
                    -s enabled=true \
                    -s publicClient=false \
                    -s secret="$ROUNDCUBE_CLIENT_SECRET" \
                    -s standardFlowEnabled=true \
                    -s directAccessGrantsEnabled=false \
                    -s serviceAccountsEnabled=false \
                    -s rootUrl="$ROUNDCUBE_URL" \
                    -s baseUrl="$ROUNDCUBE_URL" \
                    -s "redirectUris=[\"$ROUNDCUBE_URL/index.php/login/oauth\"]" \
                    -s "webOrigins=[\"$ROUNDCUBE_URL\"]" \
                    -s "attributes={\"post.logout.redirect.uris\":\"$ROUNDCUBE_URL/*\"}" >/dev/null
                fi
                echo "Roundcube OpenID Connect client is ready"
              fi

              if [ "$GRAFANA_ENABLED" = true ]; then
                echo "Ensuring the Grafana OpenID Connect client exists..."
                grafana_id=$("$KCADM" get clients -r "$KEYCLOAK_REALM" \
                  -q clientId="$GRAFANA_CLIENT_ID" --fields id,clientId \
                  | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)

                if [ -z "$grafana_id" ]; then
                  "$KCADM" create clients -r "$KEYCLOAK_REALM" \
                    -s clientId="$GRAFANA_CLIENT_ID" \
                    -s name="Grafana Monitoring" \
                    -s enabled=true \
                    -s protocol=openid-connect \
                    -s publicClient=false \
                    -s secret="$GRAFANA_CLIENT_SECRET" \
                    -s standardFlowEnabled=true \
                    -s directAccessGrantsEnabled=false \
                    -s serviceAccountsEnabled=false \
                    -s rootUrl="$GRAFANA_URL" \
                    -s baseUrl="$GRAFANA_URL" \
                    -s "redirectUris=[\"$GRAFANA_URL/login/generic_oauth\"]" \
                    -s "webOrigins=[\"$GRAFANA_URL\"]" \
                    -s "attributes={\"post.logout.redirect.uris\":\"$GRAFANA_URL/*\"}" >/dev/null
                  grafana_id=$("$KCADM" get clients -r "$KEYCLOAK_REALM" \
                    -q clientId="$GRAFANA_CLIENT_ID" --fields id,clientId \
                    | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n1)
                else
                  "$KCADM" update "clients/$grafana_id" -r "$KEYCLOAK_REALM" \
                    -s name="Grafana Monitoring" \
                    -s enabled=true \
                    -s publicClient=false \
                    -s secret="$GRAFANA_CLIENT_SECRET" \
                    -s standardFlowEnabled=true \
                    -s directAccessGrantsEnabled=false \
                    -s serviceAccountsEnabled=false \
                    -s rootUrl="$GRAFANA_URL" \
                    -s baseUrl="$GRAFANA_URL" \
                    -s "redirectUris=[\"$GRAFANA_URL/login/generic_oauth\"]" \
                    -s "webOrigins=[\"$GRAFANA_URL\"]" \
                    -s "attributes={\"post.logout.redirect.uris\":\"$GRAFANA_URL/*\"}" >/dev/null
                fi
                test -n "$grafana_id"

                if ! "$KCADM" get "clients/$grafana_id/protocol-mappers/models" \
                  -r "$KEYCLOAK_REALM" --fields name | grep -q '"groups"'; then
                  "$KCADM" create "clients/$grafana_id/protocol-mappers/models" -r "$KEYCLOAK_REALM" \
                    -s name=groups \
                    -s protocol=openid-connect \
                    -s protocolMapper=oidc-group-membership-mapper \
                    -s consentRequired=false \
                    -s 'config."claim.name"="groups"' \
                    -s 'config."full.path"="false"' \
                    -s 'config."id.token.claim"="true"' \
                    -s 'config."access.token.claim"="true"' \
                    -s 'config."userinfo.token.claim"="true"' >/dev/null
                fi
                echo "Grafana OpenID Connect client is ready"
              fi
          env:
            - name: KEYCLOAK_URL
              value: "http://{{ include "nextcloud-stack.fullname" . }}-keycloak:8080"
            - name: KEYCLOAK_REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: KEYCLOAK_ADMIN
              value: {{ .Values.operator.admins.keycloak.username | quote }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: keycloak-admin-password
            - name: SESSION_IDLE_TIMEOUT
              value: {{ .Values.operator.session.idleTimeoutSeconds | quote }}
            - name: SESSION_MAX_LIFESPAN
              value: {{ .Values.operator.session.maxLifespanSeconds | quote }}
            - name: ACCESS_TOKEN_LIFESPAN
              value: {{ .Values.operator.session.accessTokenLifespanSeconds | quote }}
            - name: LDAP_URL
              value: {{ printf "%s:%s" (include "nextcloud-stack.ldapUri" .) (include "nextcloud-stack.ldapPort" .) | quote }}
            - name: LDAP_USERS_DN
              value: {{ include "nextcloud-stack.ldapUsersDn" . | quote }}
            - name: LDAP_GROUPS_DN
              value: {{ include "nextcloud-stack.ldapGroupsDn" . | quote }}
            - name: LDAP_GROUP_FILTER
              value: {{ include "nextcloud-stack.ldapFilter" (list . "groups") | quote }}
            - name: LDAP_BIND_DN
              value: {{ include "nextcloud-stack.ldapBindDn" . | quote }}
            - name: LDAP_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.ldapBindSecretName" . }}
                  key: {{ include "nextcloud-stack.ldapBindSecretKey" . }}
            - name: LDAP_VENDOR
              value: {{ ternary "ad" "other" (and (eq (include "nextcloud-stack.identityMode" .) "external") (eq .Values.identityDirectory.external.schema "activeDirectory")) | quote }}
            - name: LDAP_PAGINATION
              value: {{ ternary "true" "false" (and (eq (include "nextcloud-stack.identityMode" .) "external") (eq .Values.identityDirectory.external.schema "activeDirectory")) | quote }}
            - name: LDAP_USERNAME_ATTR
              value: {{ include "nextcloud-stack.ldapUsernameAttr" . | quote }}
            - name: LDAP_RDN_ATTR
              value: {{ include "nextcloud-stack.ldapRdnAttr" . | quote }}
            - name: LDAP_UUID_ATTR
              value: {{ include "nextcloud-stack.ldapUuidAttr" . | quote }}
            - name: LDAP_USER_OBJECT_CLASS
              value: {{ include "nextcloud-stack.ldapUserObjectClass" . | quote }}
            - name: LDAP_USER_FILTER
              value: {{ include "nextcloud-stack.ldapFilter" (list . "users") | quote }}
            - name: LDAP_FIRST_NAME_ATTR
              value: {{ include "nextcloud-stack.ldapFirstNameAttr" . | quote }}
            - name: LDAP_LAST_NAME_ATTR
              value: {{ include "nextcloud-stack.ldapLastNameAttr" . | quote }}
            - name: LDAP_GROUP_NAME_ATTR
              value: {{ include "nextcloud-stack.ldapGroupNameAttr" . | quote }}
            - name: LDAP_GROUP_OBJECT_CLASS
              value: {{ include "nextcloud-stack.ldapGroupObjectClass" . | quote }}
            - name: LDAP_GROUP_MEMBERSHIP_ATTR
              value: {{ include "nextcloud-stack.ldapGroupMembershipAttr" . | quote }}
            - name: LDAP_GROUP_MEMBERSHIP_TYPE
              value: {{ include "nextcloud-stack.ldapGroupMembershipType" . | quote }}
            - name: LDAP_GROUP_MEMBERSHIP_USER_ATTR
              value: {{ include "nextcloud-stack.ldapGroupMembershipUserAttr" . | quote }}
            - name: LDAP_FULL_SYNC_PERIOD
              value: {{ .Values.keycloak.ldapSync.fullPeriodSeconds | quote }}
            - name: LDAP_CHANGED_SYNC_PERIOD
              value: {{ ternary .Values.keycloak.ldapSync.changedPeriodSeconds .Values.keycloak.ldapSync.externalChangedPeriodSeconds (eq (include "nextcloud-stack.identityMode" .) "embedded") | quote }}
            - name: ROUNDCUBE_ENABLED
              value: {{ .Values.roundcube.enabled | quote }}
            {{- if .Values.roundcube.enabled }}
            - name: ROUNDCUBE_CLIENT_ID
              value: {{ .Values.roundcube.clientId | quote }}
            - name: ROUNDCUBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: roundcube-oauth-client-secret
            - name: ROUNDCUBE_URL
              value: "https://{{ (include "nextcloud-stack.host" (list . "webmail")) }}"
            {{- end }}
            - name: GRAFANA_ENABLED
              value: {{ .Values.monitoring.enabled | quote }}
            {{- if .Values.monitoring.enabled }}
            - name: GRAFANA_CLIENT_ID
              value: {{ .Values.monitoring.integration.clientId | quote }}
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: grafana-oauth-client-secret
            - name: GRAFANA_URL
              value: "https://{{ (include "nextcloud-stack.host" (list . "grafana")) }}"
            {{- end }}
          resources:
            {{- toYaml .Values.helperResources | nindent 12 }}
{{- end }}
