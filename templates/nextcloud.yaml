{{- $antiAffinity := required "nextcloud.scheduling.antiAffinity must be set by values-test.yaml or values-prod.yaml" .Values.nextcloud.scheduling.antiAffinity }}
{{- if not (has $antiAffinity (list "preferred" "required")) }}
{{- fail "nextcloud.scheduling.antiAffinity must be preferred or required" }}
{{- end }}
{{- if and (eq .Values.deploymentProfile "prod") (ne .Values.nextcloud.persistence.accessMode "ReadWriteMany") }}
{{- fail "production Nextcloud replicas on separate nodes require nextcloud.persistence.accessMode=ReadWriteMany" }}
{{- end }}
{{- $sessionIdle := int .Values.operator.session.idleTimeoutSeconds }}
{{- $sessionMax := int .Values.operator.session.maxLifespanSeconds }}
{{- $accessToken := int .Values.operator.session.accessTokenLifespanSeconds }}
{{- if le $sessionIdle 0 }}
{{- fail "operator.session.idleTimeoutSeconds must be greater than zero" }}
{{- end }}
{{- if ne (mod $sessionIdle 60) 0 }}
{{- fail "operator.session.idleTimeoutSeconds must be divisible by 60" }}
{{- end }}
{{- if lt $sessionMax $sessionIdle }}
{{- fail "operator.session.maxLifespanSeconds must be greater than or equal to idleTimeoutSeconds" }}
{{- end }}
{{- if or (le $accessToken 0) (gt $accessToken $sessionIdle) }}
{{- fail "operator.session.accessTokenLifespanSeconds must be greater than zero and no longer than idleTimeoutSeconds" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-php
  labels:
    app.kubernetes.io/component: nextcloud
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
data:
  zz-nextcloud-opcache.ini: |
    opcache.enable=1
    opcache.memory_consumption={{ .Values.nextcloud.opcache.memoryConsumption }}
    opcache.interned_strings_buffer={{ .Values.nextcloud.opcache.internedStringsBuffer }}
    opcache.max_accelerated_files={{ .Values.nextcloud.opcache.maxAcceleratedFiles }}
  {{- if .Values.identityDirectory.enabled }}
  ldap.conf: |
    TLS_CACERT /etc/ssl/certs/lldap-ca.crt
    TLS_REQCERT demand
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-nextcloud
  labels:
    app.kubernetes.io/component: nextcloud
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: nextcloud
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-nextcloud
  labels:
    app.kubernetes.io/component: nextcloud
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.nextcloud.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: nextcloud
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/php-session-config: {{ dict "opcache" .Values.nextcloud.opcache "phpSession" .Values.nextcloud.phpSession "session" .Values.operator.session | toJson | sha256sum }}
      labels:
        app.kubernetes.io/component: nextcloud
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      affinity:
        podAntiAffinity:
          {{- if eq $antiAffinity "required" }}
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: nextcloud
                  app.kubernetes.io/instance: {{ .Release.Name }}
              topologyKey: {{ .Values.nextcloud.scheduling.topologyKey | quote }}
          {{- else }}
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: nextcloud
                    app.kubernetes.io/instance: {{ .Release.Name }}
                topologyKey: {{ .Values.nextcloud.scheduling.topologyKey | quote }}
          {{- end }}
      initContainers:
        {{- include "nextcloud-stack.waitForDataStores" . | nindent 8 }}
        {{- if .Values.nextcloud.phpSession.enabled }}
        - name: configure-redis-session
          image: "{{ .Values.nextcloud.image.repository }}:{{ .Values.nextcloud.image.tag }}"
          imagePullPolicy: {{ .Values.nextcloud.image.pullPolicy }}
          command: [php, -r]
          args:
            - |
              $savePath = sprintf(
                  'tcp://%s:6379?auth=%s&database=%d&prefix=nc_session:',
                  getenv('REDIS_HOST'),
                  rawurlencode(getenv('REDIS_PASSWORD')),
                  (int) getenv('REDIS_SESSION_DATABASE')
              );
              $ini = "session.save_handler=redis\n"
                  . 'session.save_path="' . $savePath . "\"\n"
                  . "session.gc_maxlifetime={{ .Values.operator.session.idleTimeoutSeconds }}\n"
                  . "redis.session.locking_enabled={{ ternary 1 0 .Values.nextcloud.phpSession.lockingEnabled }}\n"
                  . "redis.session.lock_retries={{ .Values.nextcloud.phpSession.lockRetries }}\n"
                  . "redis.session.lock_wait_time={{ .Values.nextcloud.phpSession.lockWaitTime }}\n";
              if (file_put_contents('/php-session/zz-nextcloud-session.ini', $ini) === false) {
                  fwrite(STDERR, "Unable to write Redis session configuration\n");
                  exit(1);
              }
          env:
            - name: REDIS_HOST
              value: {{ include "nextcloud-stack.fullname" . }}-redis
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: redis-password
            - name: REDIS_SESSION_DATABASE
              value: {{ .Values.nextcloud.phpSession.redisDatabase | quote }}
          volumeMounts:
            - name: php-session-config
              mountPath: /php-session
          resources:
            {{- toYaml .Values.helperResources | nindent 12 }}
        {{- end }}
      containers:
        - name: nextcloud
          image: "{{ .Values.nextcloud.image.repository }}:{{ .Values.nextcloud.image.tag }}"
          imagePullPolicy: {{ .Values.nextcloud.image.pullPolicy }}
          env:
            - name: MYSQL_HOST
              value: {{ include "nextcloud-stack.fullname" . }}-mariadb
            - name: MYSQL_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mariadb.username | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: mariadb-password
            - name: REDIS_HOST
              value: {{ include "nextcloud-stack.fullname" . }}-redis
            - name: REDIS_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: redis-password
            - name: NEXTCLOUD_ADMIN_USER
              value: {{ .Values.operator.admins.nextcloud.username | quote }}
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: nextcloud-admin-password
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: {{ printf "%s %s-nextcloud" (include "nextcloud-stack.host" (list . "nextcloud")) (include "nextcloud-stack.fullname" .) | quote }}
            - name: TRUSTED_PROXIES
              value: {{ join " " .Values.nextcloud.trustedProxies | quote }}
            - name: OVERWRITEPROTOCOL
              value: https
            - name: PHP_MEMORY_LIMIT
              value: {{ .Values.nextcloud.phpMemoryLimit | quote }}
            - name: PHP_UPLOAD_LIMIT
              value: {{ .Values.nextcloud.phpUploadLimit | quote }}
            - name: NEXTCLOUD_INIT_HTACCESS
              value: "true"
            - name: NEXTCLOUD_OBJECTSTORE_ENABLED
              value: {{ .Values.nextcloud.objectStore.enabled | quote }}
            {{- if .Values.nextcloud.objectStore.enabled }}
            - name: S3_HOSTNAME
              value: {{ required "nextcloud.objectStore.s3.hostname is required when primary object storage is enabled" .Values.nextcloud.objectStore.s3.hostname | quote }}
            - name: S3_PORT
              value: {{ .Values.nextcloud.objectStore.s3.port | quote }}
            - name: S3_BUCKET
              value: {{ required "nextcloud.objectStore.s3.bucket is required when primary object storage is enabled" .Values.nextcloud.objectStore.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.nextcloud.objectStore.s3.region | quote }}
            - name: S3_USE_SSL
              value: {{ .Values.nextcloud.objectStore.s3.useSsl | quote }}
            - name: S3_USE_PATH_STYLE
              value: {{ .Values.nextcloud.objectStore.s3.usePathStyle | quote }}
            - name: S3_OBJECT_PREFIX
              value: {{ default (printf "%s/urn:oid:" (include "nextcloud-stack.domain" .)) .Values.nextcloud.objectStore.s3.objectPrefix | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "nextcloud-stack.fullname" . }}
                  key: s3-secret-key
            {{- end }}
          ports:
            - name: http
              containerPort: 80
          startupProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: {{ (include "nextcloud-stack.host" (list . "nextcloud")) | quote }}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: {{ (include "nextcloud-stack.host" (list . "nextcloud")) | quote }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: {{ (include "nextcloud-stack.host" (list . "nextcloud")) | quote }}
            periodSeconds: 30
          volumeMounts:
            - name: nextcloud
              mountPath: /var/www/html
            - name: php-config
              mountPath: /usr/local/etc/php/conf.d/zz-nextcloud-opcache.ini
              subPath: zz-nextcloud-opcache.ini
              readOnly: true
            - name: objectstore-hooks
              mountPath: /docker-entrypoint-hooks.d/pre-installation/20-nextcloud-stack-objectstore.sh
              subPath: objectstore.sh
              readOnly: true
            - name: objectstore-hooks
              mountPath: /docker-entrypoint-hooks.d/before-starting/20-nextcloud-stack-objectstore.sh
              subPath: objectstore.sh
              readOnly: true
            {{- if .Values.nextcloud.phpSession.enabled }}
            - name: php-session-config
              mountPath: /usr/local/etc/php/conf.d/zz-nextcloud-session.ini
              subPath: zz-nextcloud-session.ini
              readOnly: true
            {{- end }}
            {{- if .Values.identityDirectory.enabled }}
            - name: ldap-config
              mountPath: /etc/ldap/ldap.conf
              subPath: ldap.conf
              readOnly: true
            - name: ldap-ca
              mountPath: /etc/ssl/certs/lldap-ca.crt
              subPath: ca.crt
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.nextcloud.resources | nindent 12 }}
      volumes:
        - name: nextcloud
          persistentVolumeClaim:
            claimName: {{ include "nextcloud-stack.fullname" . }}-nextcloud
        - name: php-config
          configMap:
            name: {{ include "nextcloud-stack.fullname" . }}-php
        - name: objectstore-hooks
          configMap:
            name: {{ include "nextcloud-stack.fullname" . }}-objectstore-hooks
            defaultMode: 0555
        {{- if .Values.nextcloud.phpSession.enabled }}
        - name: php-session-config
          emptyDir: {}
        {{- end }}
        {{- if .Values.identityDirectory.enabled }}
        - name: ldap-config
          configMap:
            name: {{ include "nextcloud-stack.fullname" . }}-php
        - name: ldap-ca
          secret:
            secretName: {{ include "nextcloud-stack.fullname" . }}-internal-ca
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-cron
  labels:
    app.kubernetes.io/component: nextcloud-cron
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: nextcloud-cron
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          initContainers:
            {{- include "nextcloud-stack.waitForNextcloud" . | nindent 12 }}
          containers:
            - name: cron
              image: "{{ .Values.nextcloud.image.repository }}:{{ .Values.nextcloud.image.tag }}"
              imagePullPolicy: {{ .Values.nextcloud.image.pullPolicy }}
              command: [php, -f, /var/www/html/cron.php]
              securityContext:
                runAsUser: 33
                runAsGroup: 33
              volumeMounts:
                - name: nextcloud
                  mountPath: /var/www/html
                - name: php-config
                  mountPath: /usr/local/etc/php/conf.d/zz-nextcloud-opcache.ini
                  subPath: zz-nextcloud-opcache.ini
                  readOnly: true
                {{- if .Values.identityDirectory.enabled }}
                - name: ldap-config
                  mountPath: /etc/ldap/ldap.conf
                  subPath: ldap.conf
                  readOnly: true
                - name: ldap-ca
                  mountPath: /etc/ssl/certs/lldap-ca.crt
                  subPath: ca.crt
                  readOnly: true
                {{- end }}
              resources:
                {{- toYaml .Values.nextcloud.resources | nindent 16 }}
          volumes:
            - name: nextcloud
              persistentVolumeClaim:
                claimName: {{ include "nextcloud-stack.fullname" . }}-nextcloud
            - name: php-config
              configMap:
                name: {{ include "nextcloud-stack.fullname" . }}-php
            {{- if .Values.identityDirectory.enabled }}
            - name: ldap-config
              configMap:
                name: {{ include "nextcloud-stack.fullname" . }}-php
            - name: ldap-ca
              secret:
                secretName: {{ include "nextcloud-stack.fullname" . }}-internal-ca
                items:
                  - key: ca.crt
                    path: ca.crt
            {{- end }}
