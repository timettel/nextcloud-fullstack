apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-nextcloud
  labels:
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.nextcloud.persistence.accessMode }}]
  {{- with .Values.nextcloud.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.nextcloud.storage }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-eurooffice
  labels:
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.eurooffice.storage }}
{{- if .Values.clamav.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-clamav
  labels:
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.clamav.storage }}
{{- end }}
{{- if and .Values.talk.enabled .Values.talk.recording.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextcloud-stack.fullname" . }}-talk-recording
  labels:
    app.kubernetes.io/component: talk-recording
    {{- include "nextcloud-stack.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.talk.recording.storage }}
{{- end }}
