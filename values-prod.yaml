# Multi-node production profile. Stateful replicas require distinct nodes and
# Nextcloud uses RWX storage supplied by the cluster.
deploymentProfile: prod

nextcloud:
  persistence:
    accessMode: ReadWriteMany
  scheduling:
    antiAffinity: required
    zoneSpread:
      enabled: true

redis:
  scheduling:
    antiAffinity: required
    zoneSpread:
      enabled: true

mariadb:
  scheduling:
    zoneSpread:
      enabled: true

fulltextsearch:
  elasticsearch:
    scheduling:
      antiAffinity: required
      zoneSpread:
        enabled: true
